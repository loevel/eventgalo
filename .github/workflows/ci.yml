name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Seul le run du commit le plus récent compte : les anciens sont annulés.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @eventgalo/api build

      - name: Typecheck web
        run: pnpm --filter @eventgalo/web exec tsc --noEmit

      - name: Test API
        run: pnpm --filter @eventgalo/api test
