name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : les runs en attente intermédiaires sont
# annulés au profit du plus récent (le run en cours n'est jamais interrompu,
# pour ne pas laisser un déploiement à moitié fait).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_API_URL: https://eventgalo-api-staging.davechendjou.workers.dev
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAD5sHuRsZx00mbF5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy API (staging)
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build web (staging)
        working-directory: apps/web
        run: pnpm run build:worker

      - name: Deploy web (staging)
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_API_URL: https://eventgalo-api.davechendjou.workers.dev
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAD5sHuRsZx00mbF5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy API (production)
        working-directory: apps/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build web (production)
        working-directory: apps/web
        run: pnpm run build:worker

      - name: Deploy web (production)
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
